<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet" />
    <title>3</title>
    <style>
        /* (既存のCSSは省略) */
        h1 { width: 100%; }
        p { width: 100%; }
        footer p { font-size: 1.1em; }
        @media (max-width: 600px) {
            h1, p { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="content">
        <p id="reading-text" style="font-size: 3em;"></p>
    </div>

    <script>
        const textSegments = [
    "〜広場の遠くにある演台の方から放送で",
    "（上り4音チャイムとサイレンの音）",
    "「", 
    "訓練、",
    "訓練。", 
    "ミサイル発射。", 
    "訓練放送です。", 
    "ミサイルが発射されたものとみられます。", 
    "訓練放送です。", 
    "建物の中、", 
    "または地下に避難してください。", 
    "」", 
    "（下り4音チャイムが2回流れる）",
    "〜広場にいた人たちは", 
    "演台まで歩き", 
    "次の文章を読み上げた。", 
    "「", 
    "上り4音チャイムとサイレンの音。", 
    "訓練、", 
    "訓練。", 
    "ミサイル発射。", 
    "訓練放送です、", 
    "訓練放送です。", 
    "訓練、", 
    "訓練。", 
    "ミサイル発射。", 
    "ミサイルを", 
    "発射しました", 
    "訓練、", 
    "訓練、", 
    "訓練で", 
    "ミサイルを発射して、", 
    "広場にいた人たちは", 
    "逃げる。", 
    "ミサイル", 
    "ミサイル", 
    "ミサイルを訓練で、", 
    "下り4音チャイムは", 
    "訓練", 
    "サイレン", 
    "広場", 
    "2回流れる広場で",
    "」",
];

// 全体のテキスト（最後に表示するため）
const fullText = textSegments
    // 各要素の前後の空白（スペース、タブ、改行）を削除
    .map(segment => segment.trim()) 
    // その後、配列を結合
    .join('');

const displayElement = document.getElementById('reading-text');
let segmentIndex = 0; // 現在表示している配列のインデックス

const FADE_OUT_DELAY = 495; // 0.5秒の待機時間を設定 (ミリ秒)

function showNextSegment() {
    // 全てのセグメントを表示し終えた場合
    if (segmentIndex >= textSegments.length) {
        // ✨ 修正案: 2番目の「〜」の前に改行を挿入するようにする
        // 最初の「〜広場の遠くにある」はそのままにし、
        // 2番目の「〜広場にいた人たちは」の前に改行を入れる。
        const finalContent = fullText.replace('〜広場にいた人たちは', '<br><br>〜広場にいた人たちは');
        
        displayElement.innerHTML = finalContent;
        window.scrollTo(0, 0); // スクロール位置も念のためリセット
        return; 
    }

    const currentSegment = textSegments[segmentIndex];
    
    // 2. 表示時間の計算: 文字数 × 1000ミリ秒 (1秒)
    const displayTime = currentSegment.length * 350;

    // 3. 表示要素をリセットし、現在のフレーズを表示
    displayElement.innerHTML = currentSegment;

    // 4. 指定時間後に非表示にし、次のフレーズを表示する処理をスケジュール
    setTimeout(() => {
        // ① 現在のフレーズを非表示（空にする）
        displayElement.innerHTML = '';
        
        // ② 0.5秒待機してから次の表示処理を呼び出す
        setTimeout(() => {
            segmentIndex++;
            showNextSegment();
        }, FADE_OUT_DELAY); 
        
    }, displayTime);
}

// 最初のセグメントの表示を開始
document.addEventListener('DOMContentLoaded', () => {
    // ページロード後、処理を開始
    showNextSegment(); 
});
    </script>
</body>
</html>
